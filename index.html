<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レイナ様へ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-dark:#06060f;
    --gold:#f2b705;
    --butter:#ffe08a;
    --cream:#fffaf1;
    --brown:#2b2410;
    --muted:#b9a978;
    box-sizing: border-box;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--ink-dark);
    font-family:'Noto Sans JP', sans-serif;
    overflow:hidden;
  }
  #app{
    position:relative;
    width:100%;
    height:100%;
    min-height:100dvh;
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8vh 6vw;
    padding-top:calc(8vh + env(safe-area-inset-top, 0px));
    padding-bottom:calc(8vh + env(safe-area-inset-bottom, 0px));
    opacity:0;
    visibility:hidden;
    transform:translateY(24px);
    transition:opacity .7s ease, transform .7s ease;
    text-align:center;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0); }

  /* COVER */
  #cover{ background:radial-gradient(ellipse at 50% 20%, #10122b 0%, var(--ink-dark) 65%); }
  #stars{ position:absolute; inset:0; overflow:hidden; }
  .star{ position:absolute; background:#fff; border-radius:50%; animation:twinkle linear infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:1;} }
  .cover-inner{ position:relative; z-index:2; }
  .cover-eyebrow{ color:var(--muted); font-size:.95rem; letter-spacing:.04em; margin-bottom:1.6rem; font-weight:300; }
  #startBtn{
    font-family:'Noto Serif JP', serif;
    font-size:clamp(2.2rem, 8vw, 3.4rem);
    color:var(--cream);
    background:none; border:none; cursor:pointer;
    padding:.3em .2em; position:relative;
    text-shadow:0 0 18px rgba(242,183,5,.55), 0 0 40px rgba(242,183,5,.25);
    transition:text-shadow .4s ease, transform .4s ease;
  }
  #startBtn:hover, #startBtn:focus-visible{ text-shadow:0 0 26px rgba(242,183,5,.85), 0 0 60px rgba(242,183,5,.4); transform:scale(1.03); }
  #startBtn::after{
    content:""; position:absolute; left:50%; bottom:-14px; transform:translateX(-50%);
    width:46px; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.7;
  }
  .cover-sub{ margin-top:2.2rem; color:var(--muted); font-size:.85rem; font-weight:300; }

  /* BOARD (likes/dislikes) */
  .board-slide{ background:var(--cream); color:var(--brown); justify-content:flex-start; }
  .board-head{ max-width:640px; margin-bottom:2rem; }
  .board-head h2{
    font-family:'Noto Serif JP', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 5.5vw, 2.3rem);
    margin:0 0 .5rem;
    color:var(--brown);
  }
  .board-head p{ margin:0; color:#8a7a4a; font-size:.9rem; font-weight:300; }
  .board{
    position:relative; width:100%; max-width:760px;
    display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start;
    gap:1.6rem; padding:0 .5rem; flex:1; overflow-y:auto;
  }
  .card{
    background:#fff;
    border-radius:16px;
    padding:.6rem .6rem .9rem;
    width:190px;
    box-shadow:0 10px 22px rgba(43,36,16,.12);
  }
  .card img{
    width:100%; height:150px; object-fit:cover; border-radius:11px; display:block;
  }
  .card .cap{
    margin-top:.7rem;
    font-size:.98rem;
    font-weight:600;
    color:var(--brown);
    font-family:'Noto Serif JP', serif;
  }
  .board .card:nth-child(1){ transform:rotate(-3deg); }
  .board .card:nth-child(2){ transform:rotate(2deg) translateY(10px); }
  .board .card:nth-child(3){ transform:rotate(-1.5deg) translateY(-6px); }

  #dislikes .card{ background:#f7f2e4; box-shadow:0 8px 16px rgba(43,36,16,.06); }
  #dislikes .card img{ filter:grayscale(.25) brightness(.96); }
  #dislikes .card .cap{ color:#8a7a5a; }

  .next-btn{
    margin-top:2.4rem;
    font-family:'Noto Sans JP', sans-serif;
    font-size:1rem; letter-spacing:.02em; color:var(--brown);
    background:var(--gold); border:none; border-radius:999px;
    padding:.85rem 2.1rem; cursor:pointer;
    box-shadow:0 8px 20px rgba(242,183,5,.35);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .next-btn:hover, .next-btn:focus-visible{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(242,183,5,.45); }

  /* FINAL */
  #final{ background:var(--ink-dark); overflow:hidden; }
  .burst{
    position:absolute; width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--gold) 40%, transparent 70%);
    opacity:0;
  }
  #final.active .burst{ animation:burstOut 1.4s ease-out forwards; }
  @keyframes burstOut{ 0%{width:10px;height:10px;opacity:1;} 60%{opacity:.9;} 100%{width:1400px;height:1400px;opacity:0;} }
  .final-content{
    position:relative; z-index:2; opacity:0; transform:translateY(16px);
    transition:opacity 1s ease .9s, transform 1s ease .9s;
  }
  #final.reveal .final-content{ opacity:1; transform:translateY(0); }

  /* Bouquet */
  .bouquet-wrap{
    position:relative; width:300px; max-width:78vw; margin:0 auto 1rem;
  }
  .bouquet-glow{
    position:absolute; inset:-15% -10% 10% -10%;
    background:radial-gradient(ellipse at 50% 35%, rgba(255,214,90,.4) 0%, rgba(255,214,90,0) 68%);
    filter:blur(4px);
    z-index:0;
  }
  .bouquet-wrap svg{ position:relative; z-index:1; width:100%; height:auto; display:block; }
  .sparkle{ animation:sparklePulse 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes sparklePulse{
    0%,100%{ opacity:.55; transform:scale(.85); }
    50%{ opacity:1; transform:scale(1.2); }
  }

  .final-msg{ max-width:520px; margin:0 auto; color:var(--cream); }
  .final-msg .jp-line{
    font-family:'Noto Serif JP', serif;
    font-size:1.15rem; line-height:2; margin-bottom:1.3rem; color:var(--butter);
  }
  .signature{ font-family:'Noto Sans JP', sans-serif; font-size:.85rem; color:var(--muted); letter-spacing:.02em; }
  .restart-btn{
    margin-top:2.2rem; font-family:'Noto Sans JP', sans-serif; font-size:1rem;
    background:none; border:1px solid var(--gold); color:var(--butter);
    border-radius:999px; padding:.7rem 1.8rem; cursor:pointer;
    transition:background .3s ease, color .3s ease;
  }
  .restart-btn:hover, .restart-btn:focus-visible{ background:var(--gold); color:var(--ink-dark); }

  @media (prefers-reduced-motion: reduce){
    .star{ animation:none; opacity:.6; }
    #final.active .burst{ animation:none; opacity:0; }
    .final-content{ transition:opacity .3s ease, transform .3s ease; }
  }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:#e3d5a0; border-radius:6px; }
</style>
</head>

  </section>

<script>
  const starsContainer = document.getElementById('stars');
  for(let i=0;i<90;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2 + 1;
    s.style.width = size+'px'; s.style.height = size+'px';
    s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
    s.style.animationDuration = (2 + Math.random()*3)+'s';
    s.style.animationDelay = (Math.random()*4)+'s';
    starsContainer.appendChild(s);
  }

  const order = ['cover','likes','dislikes','final'];
  let current = 0;
  function showSlide(index){
    order.forEach((id,i)=>{
      const el = document.getElementById(id);
      el.classList.toggle('active', i===index);
      if(id==='final') el.classList.remove('reveal');
    });
    current = index;
    if(order[index]==='final'){
      setTimeout(()=>{ document.getElementById('final').classList.add('reveal'); }, 700);
    }
  }
  document.getElementById('startBtn').addEventListener('click', ()=> showSlide(1));
  document.querySelectorAll('[data-next]').forEach(btn=>{
    btn.addEventListener('click', ()=> showSlide(Math.min(current+1, order.length-1)));
  });
  document.querySelector('[data-restart]').addEventListener('click', ()=> showSlide(0));
</script>
